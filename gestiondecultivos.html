<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Cultivos - Panel de Control</title>
    <link rel="stylesheet" href="Css/gestiondecultivos.css">
    <link rel="stylesheet" href="Css/responsive.css">
</head>
<body class="app-layout">

    <!-- Barra de Navegación Izquierda -->
    <aside class="sidebar">
    <header class="sidebar-header">
        <!-- Reemplaza el span por la etiqueta de la imagen -->
        <a href="dashboard-caficultor.html" class="brand-link">
            <img src="Imagenes/logo2.png" alt="Coffee+visión" class="brand-logo">
        </a>
    </header>

        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-link active">
                <span class="nav-icon"></span>
                <span class="nav-text">Panel Principal</span>
            <a href="dashboard-caficultor.html" class="nav-link"><i class="fa-solid fa-house"></i> Mi finca</a>
            <a href="gestiondecultivos.html"class= "nav-link"><i class="fa-solid fa-seedling"></i> Cultivos</a>
            <a href="estadisticas.html" class= "nav-link"><i class="fa-solid fa-chart-simple"></i> Estadisticas</a>
            <a href="guias_plantas.html" class= "nav-link"><i class="fa-solid fa-book-open"></i> Guias</a>
            <a href="plagas.html" class="nav-link"><i class="fa-solid fa-bug"></i> Plagas y enfermedades</a>
        </nav>

        <footer class="sidebar-footer">
            
            <span class="user-name">Administrador</span>
        </footer>
    </aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <header class="top-header">
            <section class="header-titles">
                <h1>Gestión de Cultivos</h1>
                <p>Seguimiento digital para optimizar el rendimiento agrícola</p>
            </section>
        </header>

        <!-- Formulario -->
        <section id="registro-seccion">
            <article class="card">
                <header class="card-header">
                    <h2 id="form-title">Registrar Nueva Actividad</h2>
                </header>

                <form action="#" method="POST" class="activity-form">
                    <p class="form-group">
                        <label for="fecha">Fecha de la Labor</label>
                        <input type="date" id="fecha" required>
                    </p>

                    <p class="form-group">
                        <label for="actividad">Tipo de Actividad</label>
                        <select id="actividad" required>
                            <option value="" disabled selected>Selecciona una opción...</option>
                            <option value="Siembra">Siembra</option>
                            <option value="Fertilización">Fertilización</option>
                            <option value="Desyerbe">Desyerbe / Limpia</option>
                            <option value="Control de Plagas">Control de Plagas (Broca/Roya)</option>
                            <option value="Poda">Poda / Zoqueo</option>
                            <option value="Recolección">Recolección (Cosecha)</option>
                            <option value="Beneficiado">Beneficiado (Lavado/Secado)</option>
                        </select>
                    </p>

                    <p class="form-group full-width">
                        <label for="observaciones">Observaciones / Detalles</label>
                        <textarea id="observaciones" rows="3" placeholder="Ej: Se aplicaron 50g de fertilizante por árbol..."></textarea>
                    </p>

                    <footer class="btn-container full-width">
                        <button type="submit" class="btn-save">Guardar Actividad</button>
                    </footer>
                </form>
            </article>
        </section>

        <!-- Tabla de Datos -->
        <section id="historial" class="table-container">
            <header class="table-header">
                <h2>Historial de Cultivos</h2>
            </header>
            <figure class="table-wrapper">
                <table id="tabla-actividades">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Actividad</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-actividades">
                        <tr>
                            <td class="text-date">2026-06-10</td>
                            <td><span class="badge badge-warning">Control de Plagas</span></td>
                            <td>Monitoreo de broca en el lote principal. Se observa baja incidencia.</td>
                            <td>
                                <details class="dropdown-actions">
                                    <summary class="btn-trigger">Acciones ▾</summary>
                                    <nav class="dropdown-menu">
                                        <a href="#editar-id-1" class="dropdown-item item-edit">Editar Registro</a>
                                        <a href="#ver-id-1" class="dropdown-item">Ver Detalles</a>
                                        <hr>
                                        <a href="#eliminar-id-1" class="dropdown-item item-delete">Eliminar</a>
                                    </nav>
                                </details>
                            </td>
                        </tr>
                        <tr>
                            <td class="text-date">2026-06-08</td>
                            <td><span class="badge badge-success">Fertilización</span></td>
                            <td>Aplicación de abono orgánico en la zona de renovación.</td>
                            <td>
                                <details class="dropdown-actions">
                                    <summary class="btn-trigger">Acciones ▾</summary>
                                    <nav class="dropdown-menu">
                                        <a href="#editar-id-2" class="dropdown-item item-edit">Editar Registro</a>
                                        <a href="#ver-id-2" class="dropdown-item">Ver Detalles</a>
                                        <hr>
                                        <a href="#eliminar-id-2" class="dropdown-item item-delete">Eliminar</a>
                                    </nav>
                                </details>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </figure>
        </section>
    </main>

</body>
</html>
